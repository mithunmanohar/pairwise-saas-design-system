<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DatePicker</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:260px}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var d=useState('2026-11-20');
  return h(F,null,
    row(cell('Typed or picked', h(C.DatePicker,{label:'Due date',value:d[0],onChange:d[1],min:'2026-11-01',max:'2026-12-31',hint:'Between 1 Nov and 31 Dec.'})),
        cell('Empty', h(C.DatePicker,{label:'Start date'})),
        cell('Error', h(C.DatePicker,{label:'Expiry',defaultValue:'2026-10-01',error:'Choose a date after today.'}))),
    h('div',{style:{height:330}}, cell('Calendar open', h(Open))));
}
function Open(){ React.useEffect(function(){ var b=document.querySelectorAll('button[aria-label^="Choose"]')[3]; if(b) b.click(); },[]); return h(C.DatePicker,{label:'Release date',defaultValue:'2026-11-24',isDateDisabled:function(d){return d==='2026-11-25'||d==='2026-11-26';}}); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
