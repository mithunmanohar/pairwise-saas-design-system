<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DateRangePicker</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:300px}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var r=useState({from:'2026-11-01',to:'2026-11-20'});
  return h(F,null,
    row(cell('Chosen', h(C.DateRangePicker,{label:'Billing period',value:r[0],onChange:r[1]})),
        cell('Empty, max 31 days', h(C.DateRangePicker,{label:'Report range',maxDays:31,hint:'Up to 31 days.'}))),
    h('div',{style:{height:380}}, cell('Open', h(C.DateRangePicker,{label:'Usage period',forceOpen:true,defaultValue:{from:'2026-11-03',to:'2026-11-12'}}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
