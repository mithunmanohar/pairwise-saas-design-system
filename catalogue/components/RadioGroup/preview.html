<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RadioGroup</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:280px}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var p=useState('team'), m=useState('rebase');
  return row(
    cell('With descriptions', h(C.RadioGroup,{label:'Plan',value:p[0],onChange:p[1],hint:'You can change plans at any time.',options:[{value:'free',label:'Free',description:'1 runner, 7-day logs'},{value:'team',label:'Team',description:'10 runners, 90-day logs'},{value:'enterprise',label:'Enterprise',description:'Contact sales',disabled:true}]})),
    cell('Horizontal', h(C.RadioGroup,{label:'Merge method',orientation:'horizontal',value:m[0],onChange:m[1],options:[{value:'merge',label:'Merge'},{value:'squash',label:'Squash'},{value:'rebase',label:'Rebase'}]})),
    cell('Error', h(C.RadioGroup,{label:'Environment',required:true,error:'Choose where to deploy.',options:['staging','production']})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
