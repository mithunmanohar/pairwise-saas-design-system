<!doctype html>
<html><head><meta charset="utf-8"><title>StatusGrid</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }

function Demo(){ var runs=['20 Oct','21','22','23','24','25','26','27','28','29'];
  var rows=[{key:'a',label:'daily_ingest'},{key:'b',label:'model_training_weekly'},{key:'c',label:'warehouse_snapshot'},{key:'d',label:'report_rollup_weekly'}];
  var cells=[['healthy','healthy','warning','healthy','healthy','healthy','critical','healthy','critical','critical'],['healthy','healthy','healthy','healthy','warning','healthy','healthy','healthy','healthy','info'],['healthy','healthy','healthy','healthy','healthy','healthy','healthy','healthy','healthy','healthy'],['unknown','unknown','unknown','healthy','unknown','unknown','unknown','unknown','unknown','unknown']];
  return h(C.StatusGrid,{rows:rows,cols:runs,cells:cells,onCell:function(){},ariaLabel:'Last 10 runs per DAG'});}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
