<!doctype html>
<html><head><meta charset="utf-8"><title>TextInput</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:240px}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var s=useState('feature/add-retry');
  return h(F,null,
    row(cell('Default', h(C.TextInput,{label:'Branch name',value:s[0],onChange:function(e){s[1](e.target.value);}})),
        cell('Placeholder + hint', h(C.TextInput,{label:'Repository',placeholder:'example-org/sample-repo',hint:'Owner and name, as on GitHub.'})),
        cell('Focus', h(C.TextInput,{label:'Run id',defaultValue:'run_8f3k2',className:'is-focus'}))),
    row(cell('Error', h(C.TextInput,{label:'Branch name',defaultValue:'feature add retry',error:'Branch names can’t contain spaces.'})),
        cell('Disabled', h(C.TextInput,{label:'Default branch',defaultValue:'main',disabled:true})),
        cell('Hidden label (search)', h(C.TextInput,{label:'Search runs',hideLabel:true,type:'search',placeholder:'Search runs'}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
