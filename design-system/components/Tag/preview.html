<!doctype html>
<html><head><meta charset="utf-8"><title>Tag</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var s=useState(['team:payments','env:staging','owner:Dev A']);
  return row(cell('Plain', h('span',{style:{display:'flex',gap:6}}, h(C.Tag,null,'needs review'), h(C.Tag,null,'flaky'))),
    cell('Identifier (mono)', h('span',{style:{display:'flex',gap:6}}, h(C.Tag,{mono:true},'feature/add-retry'), h(C.Tag,{mono:true},'4f9c2e1'))),
    cell('Removable (filters)', h('span',{style:{display:'flex',gap:6}}, s[0].map(function(t){ return h(C.Tag,{key:t,onRemove:function(){ s[1](s[0].filter(function(x){return x!==t;})); }},t); }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
