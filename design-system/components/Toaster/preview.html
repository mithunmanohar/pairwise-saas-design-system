<!doctype html>
<html><head><meta charset="utf-8"><title>Toaster</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){
  React.useEffect(function(){ C.toast({tone:'healthy',title:'Run run_8f3k2 re-queued',body:'You’ll get a notification when it finishes.',duration:null}); },[]);
  return h('div',{style:{position:'relative',height:228}},
    row(cell('Trigger', h('span',{style:{display:'flex',gap:8}},
      h(C.Button,{onClick:function(){ C.toast('Link copied'); }},'Show info'),
      h(C.Button,{onClick:function(){ C.toast({tone:'critical',title:'Couldn’t merge',body:'GitHub returned 409: the branch is out of date.',action:'Update branch'}); }},'Show error')))),
    h(C.Toaster,{contained:true}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
