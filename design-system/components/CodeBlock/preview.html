<!doctype html>
<html><head><meta charset="utf-8"><title>CodeBlock</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
var log=['2026-10-29 14:02:11  INFO  Checking out feature/add-retry at 4f9c2e1','2026-10-29 14:02:13  INFO  Installing dependencies (pnpm 9.12.0)','2026-10-29 14:02:41  INFO  Running 214 tests','2026-10-29 14:03:05  ERROR retry.test.ts › retries 3 times then fails: expected 3 calls, received 4','2026-10-29 14:03:05  INFO  213 passed, 1 failed','2026-10-29 14:03:06  INFO  Exit code 1'].join('\n');
var code='export async function withRetry<T>(fn: () => Promise<T>, attempts = 3): Promise<T> {\n  let last: unknown;\n  for (let i = 0; i < attempts; i++) {\n    try { return await fn(); } catch (e) { last = e; }\n  }\n  throw last;\n}';
function Demo(){
  return h(F,null, cell('Log with a highlighted line', h('div',{style:{width:880}}, h(C.CodeBlock,{title:'Build log, run_8f3k2',code:log,highlight:[4]}))),
    cell('Code', h('div',{style:{width:880}}, h(C.CodeBlock,{title:'src/retry.ts',code:code}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
