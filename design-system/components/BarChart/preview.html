<!-- @dsCard group="Charts" height=420 width=1000 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>BarChart</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }

var days=['21 Oct','22','23','24','25','26','27','28','29'];
function Demo(){ return h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}},
  cell('Stacked by status: failures by day. Textures off (default); a11y/print turns them on', h('div',{style:{width:'100%'}},h(C.BarChart,{categories:days,unit:'runs',series:[{name:'Failed',values:[3,1,0,2,5,1,0,4,2],color:'status-critical',pattern:'hatch'},{name:'Succeeded after retry',values:[6,4,3,5,7,2,3,6,4],color:'status-warning',pattern:'dots'}],ariaLabel:'DAG failures per day'}))),
  cell('Stacked by category: spend by team, USD (categorical)', h('div',{style:{width:'100%'}},h(C.BarChart,{categories:['Jun','Jul','Aug','Sep','Oct'],unit:'USD k',series:[{name:'data-science',values:[18.2,19.6,21.4,22.9,24.1],color:'chart-1'},{name:'example-team',values:[11.4,12.1,12.8,14.6,15.2],color:'chart-2'},{name:'search-ml',values:[7.9,8.3,8.1,9.4,10.7],color:'chart-3'},{name:'Other',values:[4.2,4.4,4.1,4.8,5.0],color:'chart-other'}]}))),
  cell('Grouped (stacked=false)', h('div',{style:{width:'100%'}},h(C.BarChart,{stacked:false,categories:['prod-1','prod-2','stg'],unit:'pods',series:[{name:'Requested',values:[412,186,94],color:'chart-other'},{name:'Running',values:[398,186,71],color:'chart-1'}]}))),
  cell('Empty', h('div',{style:{width:'100%'}},h(C.BarChart,{state:'empty',categories:[],series:[]}))));}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
