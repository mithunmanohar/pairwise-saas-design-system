<!doctype html>
<html><head><meta charset="utf-8"><title>PageHeader</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }

function Demo(){ return h('div',{className:'pv-frame'}, h(C.PageHeader,{crumbs:h(C.Breadcrumbs,{items:[{label:'Services & APIs'},{label:'sample-api',mono:true}]}),back:h(C.Button,{variant:'ghost',size:'sm',icon:'arrow-left'},'Platform overview'),title:'sample-api',titleMono:true,status:h(C.StatusBadge,{status:'critical',label:'SLO breach'}),meta:'example-team, Deployment, v2.14.1, owner @example-team-oncall',actions:h(F,null,h(C.Button,{variant:'secondary',icon:'external'},'Dashboards'),h(C.Button,{variant:'primary'},'Open incident')),tabs:h(C.Tabs,{value:'overview',tabs:[{value:'overview',label:'Overview'},{value:'pods',label:'Pods',count:'2 failing',tone:'critical'},{value:'metrics',label:'Metrics'},{value:'logs',label:'Logs'},{value:'changes',label:'Changes',count:3},{value:'cost',label:'Cost'},{value:'config',label:'Config'}]})}));}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
