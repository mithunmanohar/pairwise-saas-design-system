<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PromptComposer</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;min-width:0}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el, w){ return h('div',{className:'pv-cell',style:w?{width:w}:undefined}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
var noop = function(){};
var MENTIONS=[{value:'checkout-api',label:'checkout-api',entity:'webapp'},{value:'dev-a',label:'Dev A',icon:'user',group:'Person'}];
function Demo(){
  var v=useState('');
  return h(F,null,
    cell('Empty, with suggestions and templates (type @ or /)', h('div',{style:{maxWidth:420}}, h(C.PromptComposer,{value:v[0],onChange:v[1],onSubmit:noop,maxLength:400,suggestions:[{label:'Summarise this page'},{label:'What changed today?'}],templates:[{label:'Compare two services…',prompt:'Compare … with …'}],mentions:MENTIONS,commands:[{value:'explain',label:'Explain'}],attachments:{files:[],onFiles:noop}}))),
    row(
      cell('Answer streaming: Send becomes Stop', h(C.PromptComposer,{defaultValue:'',onSubmit:noop,busy:true,onStop:noop}),300),
      cell('Disabled, with the reason', h(C.PromptComposer,{onSubmit:noop,disabled:true,disabledReason:'You have read-only access to this project.'}),300),
      cell('Too long', h(C.PromptComposer,{defaultValue:'Summarise every incident in the last quarter by squad',onSubmit:noop,maxLength:40}),300)));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
