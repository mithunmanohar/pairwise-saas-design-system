<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FileUpload</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:min(520px,100%)}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var f=useState([{id:'a',name:'sbom.json',size:184320,status:'uploading',progress:62},{id:'b',name:'CODEOWNERS',size:812,status:'done'},{id:'c',name:'coverage.txt',size:44032,status:'error',error:'The upload was interrupted. Try again.'}]);
  return row(cell('Drop zone with uploads', h(C.FileUpload,{label:'Attachments',hint:'JSON, text or CODEOWNERS, up to 5 MB each.',accept:'.json,.txt,CODEOWNERS',maxSize:5*1024*1024,files:f[0],onRemove:function(id){f[1](f[0].filter(function(x){return x.id!==id;}));}})),
    cell('Single file, disabled', h(C.FileUpload,{label:'Signing key',multiple:false,disabled:true,hint:'Only owners can upload keys.'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
