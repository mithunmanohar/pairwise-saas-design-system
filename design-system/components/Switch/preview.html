<!doctype html>
<html><head><meta charset="utf-8"><title>Switch</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:stretch;width:170px}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }
function Demo(){ var s=useState(true);
  return h(F,null,
    row(cell('Off / on', h(F,null, h(C.Switch,{label:'Auto-merge'}), h(C.Switch,{label:'Run checks on push',checked:s[0],onChange:s[1]}))),
        cell('Hint', h(C.Switch,{label:'Notify on failure',defaultChecked:true,hint:'Sends a message to the PR author.'})),
        cell('Disabled', h(F,null, h(C.Switch,{label:'Require signed commits',disabled:true}), h(C.Switch,{label:'Branch protection',defaultChecked:true,disabled:true})))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
