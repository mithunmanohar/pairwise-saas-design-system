<!doctype html>
<html><head><meta charset="utf-8"><title>MenuSelect</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }

function Demo(){ var s=useState('cluster-prod-1');
  var opts=[{value:'cluster-prod-1',label:'cluster-prod-1',meta:'region-a'},{value:'cluster-prod-2',label:'cluster-prod-2',meta:'region-b'},{value:'cluster-stg-1',label:'cluster-stg-1',meta:'staging'}];
  return h(F,null, row(cell('Default',h(C.MenuSelect,{label:'Cluster',prefix:'Cluster',value:s[0],options:opts,onChange:s[1]})), cell('Disabled',h(C.MenuSelect,{label:'Cloud',prefix:'Cloud',value:'cloud-b',options:['cloud-b'],disabled:true})), cell('Open',h('div',{style:{height:150}},h(C.MenuSelect,{label:'Namespace',prefix:'Namespace',value:'example-team',options:['example-team','data-science','feature-store','kube-system'],forceOpen:true})))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
