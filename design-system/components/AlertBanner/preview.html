<!doctype html>
<html><head><meta charset="utf-8"><title>AlertBanner</title>
<style>
.pv{padding:16px;display:grid;gap:14px;align-content:start;color:var(--ink)}
.pv-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pv-cell{display:grid;gap:6px;justify-items:start}
.pv-lab{font:11px/16px var(--font-mono);color:var(--ink-muted)}
.pv-frame{position:relative;border:1px solid var(--border);background:var(--surface);overflow:hidden}
</style></head>
<body><div id="root" class="pv"></div>
<script>
var C = window.Pairwise, h = React.createElement, F = React.Fragment, useState = React.useState;
function cell(label, el){ return h('div',{className:'pv-cell'}, h('span',{className:'pv-lab'}, label), el); }
function row(){ return h('div',{className:'pv-row'}, Array.prototype.slice.call(arguments)); }

function Demo(){ return h('div',{style:{display:'grid',gap:8}},
  h(C.AlertBanner,{tone:'critical',title:'SEV2 open: sample-api p95 latency 412 ms (SLO 300 ms).',meta:'alert_q3x7n, 21 min',action:'Investigate'}),
  h(C.AlertBanner,{tone:'warning',title:'Partial data.',meta:'Scheduler metadata DB replica lagging 6 min',children:'Run states after 14:46 may be stale.'}),
  h(C.AlertBanner,{tone:'info',title:'Maintenance window Sat 2 Nov 01:00–03:00 UTC:',children:'cluster-prod-2 node group upgrade to 1.31.',onDismiss:function(){}}),
  h(C.AlertBanner,{tone:'healthy',title:'Resolved.',children:'Latency back under SLO after rollback to v2.14.0.',onDismiss:function(){}}));}

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body></html>
