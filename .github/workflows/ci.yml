name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build → typecheck → lint → tests (contrast, colour-blind separation, generators, prop types)
      - run: pnpm run ci
      # The build regenerates the preview kit and the catalogue; they must be committed with the source change.
      - run: pnpm check:generated
